<style>
/* Layout: full-screen low-poly island you walk around; HUD in the corners, a chunky hard-shadow card for each CV stop (side panel on PC, bottom sheet on phone). Single committed look. */
:root {
  --ink: #17202a;
  --muted: #56616d;
  --card: #ffffff;
  --sky: #cfdcea;
  --cobalt: #2348c9;
  --signal: #e8590c;
  --leaf: #3f7d43;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--sky); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

/* HUD */
.hud { position: fixed; z-index: 5; pointer-events: none; }
.hud > * { pointer-events: auto; }
.brand {
  top: calc(env(safe-area-inset-top, 0px) + 14px); left: max(16px, env(safe-area-inset-left, 0px));
  background: var(--ink); color: #fff; padding: 8px 12px 9px;
  box-shadow: 4px 4px 0 var(--signal);
}
.brand b { display: block; font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1; letter-spacing: -.01em; }
.brand span { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .75; }
.top-right {
  top: calc(env(safe-area-inset-top, 0px) + 14px); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 8px; align-items: stretch;
}
.progress {
  background: var(--card); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
  padding: 6px 10px; display: grid; gap: 4px; min-width: 120px;
}
.progress .lbl { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.progress .lbl b { color: var(--ink); }
.pips { display: flex; gap: 3px; }
.pips i { width: 9px; height: 9px; border: 1.5px solid var(--ink); }
.pips i.on { background: var(--signal); border-color: var(--signal); }
.btn {
  background: var(--card); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
  font-family: var(--mono); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
  padding: 8px 14px; cursor: pointer; transition: transform .08s, box-shadow .08s;
}
.btn:hover { background: #eef2ff; }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn.primary { background: var(--signal); color: #fff; border-color: var(--ink); }
.btn.primary:hover { background: #d14d06; }

.next {
  top: calc(env(safe-area-inset-top, 0px) + 82px); left: 50%; transform: translateX(-50%);
  background: rgba(23,32,42,.88); color: #fff; padding: 6px 12px;
  font-family: var(--mono); font-size: 12.5px; letter-spacing: .03em; white-space: nowrap;
  max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis;
}
.next b { color: #ffb38a; font-weight: 600; }
.hint {
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); left: max(16px, env(safe-area-inset-left, 0px));
  font-family: var(--mono); font-size: 12px; color: var(--ink);
  background: rgba(255,255,255,.85); border: 1.5px solid var(--ink); padding: 5px 9px;
}
.hint kbd { font-family: var(--mono); font-size: 11px; border: 1.5px solid var(--ink); border-bottom-width: 3px; padding: 0 5px; background: #fff; }

/* Joystick */
.joy { position: fixed; z-index: 6; width: 120px; height: 120px; margin: -60px 0 0 -60px; border: 3px solid rgba(23,32,42,.55); border-radius: 50%; background: rgba(255,255,255,.25); pointer-events: none; }
.joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: var(--signal); border: 3px solid var(--ink); }

/* CV card */
.card {
  position: fixed; z-index: 7;
  right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 82px);
  width: min(410px, calc(100vw - 32px)); max-height: calc(100% - 170px); overflow: auto;
  background: var(--card); border: 2.5px solid var(--ink); box-shadow: 8px 8px 0 var(--ink);
  transform: translateX(calc(100% + 40px)); transition: transform .35s cubic-bezier(.2,.9,.25,1.15);
}
.card.show { transform: none; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px 8px 14px; background: var(--ink); color: #fff; position: sticky; top: 0; }
.card-head span { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.card-head button { background: transparent; border: 1.5px solid rgba(255,255,255,.6); color: #fff; width: 30px; height: 28px; cursor: pointer; font-size: 16px; line-height: 1; }
.card-inner { padding: 14px 16px 18px; display: grid; gap: 10px; }
.card h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.02; letter-spacing: -.015em; text-wrap: balance; }
.card .sub { font-family: var(--mono); font-size: 12.5px; color: var(--signal); text-transform: uppercase; letter-spacing: .05em; }
.card p { margin: 0; }
.card ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.card .tags { display: flex; flex-wrap: wrap; gap: 5px; }
.card .tags span { font-family: var(--mono); font-size: 12px; border: 1.5px solid var(--ink); padding: 2px 7px; }
.card .stat { display: flex; align-items: baseline; gap: 8px; }
.card .stat b { font-family: var(--display); font-weight: 800; font-size: 56px; line-height: 1; color: var(--cobalt); }
.card .stat span { color: var(--muted); }
.card .grp { display: grid; gap: 5px; }
.card .grp h3 { margin: 0; font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.card a { color: var(--cobalt); font-weight: 700; text-underline-offset: 3px; overflow-wrap: anywhere; }
.card .contact { display: grid; gap: 8px; }
.card .contact div { display: grid; gap: 2px; }
.card .contact small { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.card .email { font-weight: 700; user-select: all; overflow-wrap: anywhere; }
.card .go { justify-self: start; margin-top: 4px; }

/* Map */
.map {
  position: fixed; z-index: 9; inset: 0; display: grid; place-items: center;
  background: rgba(23,32,42,.45);
  padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px));
}
.map-box { width: min(460px, 100%); max-height: 100%; overflow: auto; background: var(--card); border: 2.5px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); }
.map-box header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--ink); color: #fff; font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.map-box header button { background: transparent; border: 1.5px solid rgba(255,255,255,.6); color: #fff; padding: 3px 9px; cursor: pointer; }
.map-box p { margin: 0; padding: 10px 14px 4px; color: var(--muted); font-size: 14px; }
.map-list { list-style: none; margin: 0; padding: 6px 0 8px; }
.map-list button { width: 100%; display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; text-align: left; background: transparent; border: 0; padding: 9px 14px; cursor: pointer; }
.map-list button:hover { background: #eef2ff; }
.map-list .n { font-family: var(--mono); font-weight: 600; color: var(--muted); }
.map-list .t { font-weight: 700; }
.map-list .s { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.map-list .s.done { color: var(--leaf); }

/* Start screen */
.start {
  position: fixed; z-index: 10; inset: 0; display: flex; align-items: flex-end;
  background: linear-gradient(180deg, rgba(23,32,42,0) 25%, rgba(23,32,42,.55) 100%);
  padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px));
}
.start-box { width: min(560px, 100%); background: var(--card); border: 3px solid var(--ink); box-shadow: 10px 10px 0 var(--signal); padding: 22px 22px 20px; display: grid; gap: 12px; margin-left: clamp(0px, 4vw, 48px); margin-bottom: clamp(0px, 4vh, 40px); }
.start-box .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--signal); }
.start-box h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(44px, 9vw, 76px); line-height: .92; letter-spacing: -.025em; }
.start-box p { margin: 0; font-size: 17px; max-width: 46ch; }
.controls { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; color: var(--muted); align-items: center; }
.controls kbd { font-family: var(--mono); font-size: 12px; color: var(--ink); border: 1.5px solid var(--ink); border-bottom-width: 3px; padding: 1px 6px; background: #fff; white-space: nowrap; }
.start-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.start-actions .btn.primary { font-size: 15px; padding: 12px 20px; }

.toast {
  position: fixed; z-index: 8; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 60px); transform: translateX(-50%);
  background: var(--leaf); color: #fff; border: 2.5px solid var(--ink); box-shadow: 5px 5px 0 var(--ink);
  padding: 10px 16px; font-weight: 700; max-width: calc(100vw - 32px); text-align: center;
}

.fallback { position: fixed; inset: 0; overflow: auto; z-index: 11; background: var(--sky); padding: 24px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
.fallback .card { position: static; transform: none; width: auto; max-width: 640px; max-height: none; margin: 0 auto 20px; }

@media (max-width: 720px) {
  .card {
    left: 0; right: 0; top: auto; bottom: 0; width: auto;
    max-height: 52%; border-width: 2.5px 0 0; box-shadow: 0 -6px 0 var(--ink);
    transform: translateY(calc(100% + 20px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .card h2 { font-size: 26px; }
  .card .stat b { font-size: 46px; }
  .progress { min-width: 0; }
  .pips i { width: 7px; height: 7px; }
  .next { top: calc(env(safe-area-inset-top, 0px) + 74px); font-size: 12px; }
  .hint { bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
  body.card-open .hint { display: none; }
  .start-box { margin: 0; padding: 18px 16px 16px; box-shadow: 6px 6px 0 var(--signal); }
}
@media (max-width: 400px) {
  .brand b { font-size: 17px; }
  .btn { padding: 7px 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .btn { transition: none; }
}
</style>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const coarse = matchMedia("(pointer: coarse)").matches;

  // ---------------- CV content ----------------

  const stops = [

    { id: "skills", label: "SKILLS", title: "Skills garden", html: `

  const N = stops.length;

      pg.setAttribute("position", new THREE.Float32BufferAttribute([0, 0, 0.6, -0.45, 0, -0.4, 0, 0.05, -0.25, 0, 0, 0.6, 0, 0.05, -0.25, 0.45, 0, -0.4, 0, 0, 0.6, 0, -0.2, -0.3, 0, 0.05, -0.25], 3));
      pg.computeVertexNormals();
      const pm = mesh(pg, new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide, flatShading: true }), 0, 0, 0, plane);
      animated.push(t => { const a = t * 0.9; plane.position.set(Math.cos(a) * 2.2, 3.6 + Math.sin(t * 2) * 0.3, Math.sin(a) * 1.4); plane.rotation.y = -a; plane.rotation.z = 0.3; });
      return 2.2;
    },
  };

  // ---------------- Place stations ----------------
  const world = [];
  stops.forEach((s, i) => {
    const a = Math.PI / 2 + i * (Math.PI * 2 / N);
    const px = Math.cos(a) * R, pz = Math.sin(a) * R;
    const ox = px, oz = pz - 6.8;
    const g = new THREE.Group(); g.position.set(ox, 0, oz); scene.add(g);
    const radius = B[s.id](g);
    colliders.push({ x: ox, z: oz, r: radius });
    const tx = px, tz = pz - 1.0;
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xe8590c, transparent: true, opacity: 0.85, depthWrite: false });
    const ring = new THREE.Mesh(new THREE.RingGeometry(2.3, 2.75, 48), ringMat);
    ring.rotation.x = -Math.PI / 2; ring.position.set(tx, 0.04, tz); scene.add(ring);
    const disc = new THREE.Mesh(new THREE.CircleGeometry(2.3, 48), new THREE.MeshBasicMaterial({ color: 0xe8590c, transparent: true, opacity: 0.12, depthWrite: false }));
    disc.rotation.x = -Math.PI / 2; disc.position.set(tx, 0.035, tz); scene.add(disc);
    const label = makeLabel(pad2(i + 1), s.label, false);
    label.position.set(ox, 6.6, oz + 0.5); scene.add(label);
    world.push({ s, i, tx, tz, ox, oz, ring, ringMat, disc, label, visited: false });
  });

  // ---------------- Trees and rocks ----------------
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const leafCols = [0x4f8f45, 0x5f9f4a, 0x3f7d43, 0x73a852];
  const trees = [];
  let placed = 0, tries = 0;
  while (placed < 85 && tries < 3000) {
    tries++;
    const a = rnd() * Math.PI * 2, r = 8.5 + rnd() * 24;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (Math.abs(r - R) < 2.6) continue;
    if (world.some(w => Math.hypot(x - w.ox, z - w.oz) < 6.5 || Math.hypot(x - w.tx, z - w.tz) < 3.5)) continue;
    if (colliders.some(c => c.tree && Math.hypot(x - c.x, z - c.z) < 2.2)) continue;
    const sc = 0.8 + rnd() * 0.7;
    if (rnd() < 0.18) {
      const rock = mesh(new THREE.DodecahedronGeometry(0.6 * sc, 0), M(0x9a958a), x, 0.3 * sc, z);
      rock.rotation.set(rnd(), rnd(), rnd());
      colliders.push({ x, z, r: 0.6 * sc, tree: true });
    } else {
      const col = leafCols[Math.floor(rnd() * leafCols.length)];
      const parts = [mesh(cyl(0.16 * sc, 0.24 * sc, 1.3 * sc, 6), M(0x7b5a3c), x, 0.65 * sc, z)];
      if (rnd() < 0.5) {
        parts.push(mesh(new THREE.ConeGeometry(1.15 * sc, 2.2 * sc, 7), M(col), x, 2.1 * sc, z));
        parts.push(mesh(new THREE.ConeGeometry(0.85 * sc, 1.6 * sc, 7), M(col), x, 3.0 * sc, z));
      } else {
        parts.push(mesh(new THREE.IcosahedronGeometry(1.15 * sc, 0), M(col), x, 2.2 * sc, z));
      }
      // own materials so a tree can fade when it blocks the view
      const mats = parts.map(p => (p.material = p.material.clone(), p.material.transparent = true, p.material));
      trees.push({ x, z, mats, o: 1 });
      colliders.push({ x, z, r: 0.45 * sc, tree: true });
    }
    placed++;
  }
  colliders.push({ x: 0, z: 0, r: 7.0 });

  // Clouds
  const clouds = [];
  for (let i = 0; i < 9; i++) {
    const c = new THREE.Group();
    for (let k = 0; k < 4; k++) {
      const m = new THREE.Mesh(new THREE.IcosahedronGeometry(1.6 + rnd() * 1.4, 0), new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true, roughness: 1 }));
      m.position.set(k * 1.8 - 2.7, rnd() * 0.8, rnd() * 1.2); c.add(m);
    }
    const a = rnd() * Math.PI * 2, r = 30 + rnd() * 30;
    c.position.set(Math.cos(a) * r, 18 + rnd() * 8, Math.sin(a) * r);
    c.userData = { a, r, sp: 0.004 + rnd() * 0.006 };
    scene.add(c); clouds.push(c);
  }

  // ---------------- Player ----------------
  const player = new THREE.Group(); scene.add(player);
  const skin = M(0xe0b08a), shirt = M(0x2348c9), pants = M(0x2b2f36), hairM = M(0x2a1c14), bag = M(0xe8590c);
  const torso = mesh(box(0.85, 1.0, 0.5), shirt, 0, 1.45, 0, player);
  mesh(new THREE.SphereGeometry(0.36, 12, 10), skin, 0, 2.28, 0, player);
  const hair = mesh(new THREE.SphereGeometry(0.38, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), hairM, 0, 2.33, -0.02, player);
  mesh(box(0.65, 0.75, 0.32), bag, 0, 1.5, -0.4, player);
  const limbs = {};
  [["lLeg", -0.21, 0.92, 0.3, 0.9, pants], ["rLeg", 0.21, 0.92, 0.3, 0.9, pants], ["lArm", -0.56, 1.88, 0.22, 0.85, shirt], ["rArm", 0.56, 1.88, 0.22, 0.85, shirt]].forEach(([k, x, y, w, h, m]) => {
    const pv = new THREE.Group(); pv.position.set(x, y, 0); player.add(pv);
    mesh(box(w, h, 0.28), m, 0, -h / 2, 0, pv);
    if (k.includes("Arm")) mesh(new THREE.SphereGeometry(0.12, 6, 5), skin, 0, -h - 0.02, 0, pv);
    else mesh(box(w + 0.04, 0.16, 0.42), M(0x17202a), 0, -h + 0.02, 0.06, pv);
    limbs[k] = pv;
  });
  const blob = new THREE.Mesh(new THREE.CircleGeometry(0.7, 20), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.18, depthWrite: false }));
  blob.rotation.x = -Math.PI / 2; blob.position.y = 0.03; scene.add(blob);

  // Guide arrow to the next stop
  const arrowShape = new THREE.Shape();
  arrowShape.moveTo(0, 0.55); arrowShape.lineTo(0.42, -0.1); arrowShape.lineTo(0.16, -0.1); arrowShape.lineTo(0.16, -0.5); arrowShape.lineTo(-0.16, -0.5); arrowShape.lineTo(-0.16, -0.1); arrowShape.lineTo(-0.42, -0.1); arrowShape.closePath();
  const arrow = new THREE.Mesh(new THREE.ShapeGeometry(arrowShape), new THREE.MeshBasicMaterial({ color: 0xe8590c, transparent: true, opacity: 0.9, depthWrite: false }));
  arrow.rotation.order = "YXZ"; scene.add(arrow);

  const start0 = world[0];
  const P = { x: start0.tx + 0.01, z: start0.tz + 0.6, yaw: Math.PI, speed: 0, phase: 0 };

  // ---------------- HUD ----------------
  $("total").textContent = N;
  $("pips").innerHTML = stops.map(() => "<i></i>").join("");
  function renderMap() {
    $("mapList").innerHTML = world.map(w => `<li><button type="button" data-i="${w.i}"><span class="n">${pad2(w.i + 1)}</span><span class="t">${w.s.title}</span><span class="s ${w.visited ? "done" : ""}">${w.visited ? "Seen" : "Go"}</span></button></li>`).join("");
  }
  function updateHud() {
    const v = world.filter(w => w.visited).length;
    $("count").textContent = v;
    $("pips").querySelectorAll("i").forEach((p, i) => p.classList.toggle("on", world[i].visited));
    renderMap();
  }
  let active = null, closedFor = null, celebrated = false;
  function showCard(w) {
    $("c-eyebrow").textContent = `Stop ${pad2(w.i + 1)} of ${N}`;
    $("c-inner").innerHTML = `<h2>${w.s.title}</h2>${w.s.html}`;
    $("card").classList.add("show"); document.body.classList.add("card-open");
    $("card").scrollTop = 0;
  }
  function hideCard() { $("card").classList.remove("show"); document.body.classList.remove("card-open"); }
  $("c-close").addEventListener("click", () => { closedFor = active; hideCard(); canvas.focus(); });
  function visit(w) {
    if (!w.visited) {
      w.visited = true; w.label.userData.draw(true);
      w.ringMat.color.set(0x3f7d43); w.disc.material.color.set(0x3f7d43);
      updateHud();
      if (!celebrated && world.every(x => x.visited)) {
        celebrated = true;
        toast("You've seen the whole CV. Thanks for walking through!");
      }
    }
  }
  let toastT = 0;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4200); }

  function openMap() { renderMap(); $("map").hidden = false; const b = $("mapList").querySelector("button"); if (b) b.focus(); }
  function closeMap() { $("map").hidden = true; canvas.focus(); }
  $("mapBtn").addEventListener("click", openMap);
  $("mapClose").addEventListener("click", closeMap);
  $("map").addEventListener("click", e => { if (e.target.id === "map") closeMap(); });
  $("mapList").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const w = world[+b.dataset.i];
    P.x = w.tx; P.z = w.tz + 0.4; P.yaw = Math.PI;
    camPos.set(P.x, 0, P.z).add(camOffset());
    closedFor = null;
    begin(); closeMap();
  });

  // ---------------- Input ----------------
  const keys = {};
  let started = false;
  function begin() {
    if (started) return;
    started = true; $("start").hidden = true; canvas.focus();
  }
  $("play").addEventListener("click", begin);
  $("startMap").addEventListener("click", () => { begin(); openMap(); });
  addEventListener("keydown", e => {
    if (!$("map").hidden) { if (e.code === "Escape" || e.code === "KeyM") { e.preventDefault(); closeMap(); } return; }
    const move = ["KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code);
    if (move) { if (!started) begin(); if (document.activeElement === canvas || document.activeElement === document.body) e.preventDefault(); }
    if (e.code === "KeyM" && started) { e.preventDefault(); openMap(); return; }
    keys[e.code] = true;
  });
  addEventListener("keyup", e => { keys[e.code] = false; });
  addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

  const joyEl = $("joy"), knob = $("knob");
  let joy = null; const J = { x: 0, z: 0 };
  canvas.addEventListener("pointerdown", e => {
    if (!started) { begin(); }
    joy = { id: e.pointerId, x0: e.clientX, y0: e.clientY };
    canvas.setPointerCapture(e.pointerId);
    joyEl.style.left = e.clientX + "px"; joyEl.style.top = e.clientY + "px"; joyEl.hidden = false;
    knob.style.transform = "translate(0,0)";
  });
  canvas.addEventListener("pointermove", e => {
    if (!joy || e.pointerId !== joy.id) return;
    let dx = e.clientX - joy.x0, dy = e.clientY - joy.y0;
    const L = Math.hypot(dx, dy), max = 55;
    if (L > max) { dx *= max / L; dy *= max / L; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    const k = Math.min(1, L / max);
    J.x = L > 6 ? dx / max : 0; J.z = L > 6 ? dy / max : 0;
    J.run = k > 0.95;
  });
  const endJoy = e => { if (joy && e.pointerId === joy.id) { joy = null; J.x = J.z = 0; joyEl.hidden = true; } };
  canvas.addEventListener("pointerup", endJoy);
  canvas.addEventListener("pointercancel", endJoy);

  // ---------------- Camera ----------------
  const camPos = new THREE.Vector3();
  function camOffset() {
    const portrait = innerHeight > innerWidth * 1.1;
    return portrait ? new THREE.Vector3(0, 17, 17) : new THREE.Vector3(0, 12.5, 14.5);
  }
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.fov = h > w ? 55 : 45; camera.updateProjectionMatrix();
  }
  addEventListener("resize", resize); resize();
  camPos.set(P.x, 0, P.z).add(camOffset());

  // ---------------- Loop ----------------
  const clock = new THREE.Clock();
  let t = 0;
  const lerpAngle = (a, b, k) => { let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI; if (d < -Math.PI) d += Math.PI * 2; return a + d * k; };

  function step() {
    const dt = Math.min(0.05, clock.getDelta()); t += dt;

    // input
    let ix = 0, iz = 0, run = false;
    if (started) {
      ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + J.x;
      iz = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0) + J.z;
      run = keys.ShiftLeft || keys.ShiftRight || J.run;
    }
    let L = Math.hypot(ix, iz); if (L > 1) { ix /= L; iz /= L; L = 1; }
    const target = L > 0.05 ? (run ? 9.5 : 5.5) * L : 0;
    P.speed += (target - P.speed) * Math.min(1, dt * 10);
    if (L > 0.05) P.yaw = lerpAngle(P.yaw, Math.atan2(ix, iz), Math.min(1, dt * 12));
    if (P.speed > 0.01 && L > 0.05) {
      P.x += ix / L * P.speed * dt; P.z += iz / L * P.speed * dt;
    }
    // collisions
    for (const c of colliders) {
      const dx = P.x - c.x, dz = P.z - c.z, d = Math.hypot(dx, dz), min = c.r + 0.45;
      if (d < min && d > 1e-4) { P.x = c.x + dx / d * min; P.z = c.z + dz / d * min; }
    }
    const dc = Math.hypot(P.x, P.z), maxR = ISLAND - 1.5;
    if (dc > maxR) { P.x *= maxR / dc; P.z *= maxR / dc; }

    // animate player
    const moving = P.speed > 0.3;
    P.phase += dt * (moving ? P.speed * 1.6 : 0);
    const sw = moving ? Math.sin(P.phase) * Math.min(0.9, P.speed * 0.12) : 0;
    limbs.lLeg.rotation.x = sw; limbs.rLeg.rotation.x = -sw;
    limbs.lArm.rotation.x = -sw * 0.9; limbs.rArm.rotation.x = sw * 0.9;
    const bob = moving ? Math.abs(Math.sin(P.phase)) * 0.08 : Math.sin(t * 2) * 0.015;
    player.position.set(P.x, bob, P.z);
    player.rotation.y = P.yaw;
    torso.rotation.x = moving ? Math.min(0.15, P.speed * 0.015) : 0;
    blob.position.set(P.x, 0.03, P.z);

    // stations
    let near = null, nd = 1e9;
    world.forEach(w => {
      const d = Math.hypot(P.x - w.tx, P.z - w.tz);
      if (d < 3.0 && d < nd) { near = w; nd = d; }
      const pulse = reduced ? 1 : 1 + Math.sin(t * 3 + w.i) * 0.06;
      w.ring.scale.setScalar(w === active ? 1.12 : pulse);
      w.label.position.y = 6.6 + (reduced ? 0 : Math.sin(t * 1.5 + w.i) * 0.15);
    });
    if (started && near !== active) {
      active = near;
      if (active) { visit(active); if (closedFor !== active) showCard(active); }
      else { hideCard(); closedFor = null; }
    }

    // guide arrow
    const nextW = world.find(w => !w.visited && w !== active);
    if (started && nextW) {
      const dx = nextW.tx - P.x, dz = nextW.tz - P.z, d = Math.hypot(dx, dz);
      arrow.visible = d > 4;
      const ang = Math.atan2(dx, dz);
      arrow.position.set(P.x + dx / d * 1.9, 0.06, P.z + dz / d * 1.9);
      arrow.rotation.set(-Math.PI / 2, ang + Math.PI, 0);
      arrow.material.opacity = 0.6 + Math.sin(t * 5) * 0.3;
      $("next").hidden = false;
      $("next").innerHTML = `Next stop: <b>${pad2(nextW.i + 1)} ${nextW.s.title}</b>`;
    } else {
      arrow.visible = false;
      const all = world.every(w => w.visited);
      $("next").hidden = !(started && all);
      if (started && all) $("next").innerHTML = "All stops seen · <b>contact is at stop 11</b>";
    }

    // fade trees standing between the camera and the player
    trees.forEach(tr => {
      const dz = tr.z - P.z, block = started && dz > -0.5 && dz < 9 && Math.abs(tr.x - P.x) < 2.6 + dz * 0.15;
      const want = block ? 0.22 : 1;
      if (Math.abs(tr.o - want) > 0.01) {
        tr.o += (want - tr.o) * Math.min(1, dt * 8);
        tr.mats.forEach(m => { m.opacity = tr.o; m.depthWrite = tr.o > 0.9; });
      }
    });

    // ambient animation
    animated.forEach(f => f(t));
    clouds.forEach(c => { c.userData.a += c.userData.sp * dt; c.position.x = Math.cos(c.userData.a) * c.userData.r; c.position.z = Math.sin(c.userData.a) * c.userData.r; });
    lampMat.emissiveIntensity = 1 + Math.sin(t * 2) * 0.3;

    // camera
    if (!started) {
      const a = t * 0.08 + 0.3;
      camera.position.set(Math.sin(a) * 46, 26, Math.cos(a) * 46);
      camera.lookAt(0, 0, 0);
      camPos.copy(camera.position);
    } else {
      const want = new THREE.Vector3(P.x, 0, P.z).add(camOffset());
      camPos.lerp(want, Math.min(1, dt * 3.2));
      camera.position.copy(camPos);
      camera.lookAt(P.x, 1.2, P.z - 1.5);
    }

    renderer.render(scene, camera);
    requestAnimationFrame(step);
  }

  updateHud();
  // Redraw printed textures once fonts arrive so signs use the right faces
  const ready = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
  ready.then(() => world.forEach(w => w.label.userData.draw(w.visited)));
  requestAnimationFrame(step);
})();
</script>

</body></html>
